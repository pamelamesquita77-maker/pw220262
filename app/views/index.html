<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problema Matemático</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="container">
        <h1>Problema Matemático</h1>

        <h2>Enunciado</h2>
        <p>{{ enunciado }}</p>

        <form action="/problema" method="POST">
            <label for="valor">Digite um número:</label>

            <input
                type="number"
                step="any"
                id="valor"
                name="valor"
                required
            >

            <button type="submit">Resolver problema</button>
        </form>

        <a href="/autor">Conheça o autor</a>
    </main>
</body>
</html>
